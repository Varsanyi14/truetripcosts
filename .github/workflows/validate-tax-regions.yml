name: Validate tax regions JSON

on:
  pull_request:
    paths:
      - "src/data/facts/tax-regions/**"
      - "schemas/tax-regions.schema.json"

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ajv-cli
        run: npm install --no-save ajv-cli ajv-formats

      - name: Validate against schema
        run: >
          npx ajv validate
          -c ajv-formats
          -s schemas/tax-regions.schema.json
          -d "src/data/facts/tax-regions/*.json"
          --strict=false

      - name: Date-honesty check against base branch (blocking)
        if: github.event_name == 'pull_request'
        run: node scripts/check-date-honesty.mjs
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}

      - name: Prose-pointer reminder (advisory, never blocks)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/check-prose-pointers.mjs
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
