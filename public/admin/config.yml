# Decap CMS config. As of slice 2, this collection covers every country file
# under src/data/facts/tax-regions/, not one named file.
#
# CORRECTIONS FROM THE ORIGINAL DRAFT, flagged per the brief's own house rule:
#
# 0. (Slice 2) The collection below adds `extension: "json"` and `format: "json"`,
#    which the brief's given YAML did not include. Decap's own docs say the
#    extension setting "determines the file extension used to save new
#    collection items"; a folder collection infers the format of an EXISTING
#    file from that file's own extension, but has no existing file to infer
#    from when an editor clicks "New Tourist tax, by country." Without an
#    explicit extension/format, that brand-new entry risks saving as
#    Markdown instead of JSON, which is exactly the claim this slice exists
#    to prove, so this is not a cosmetic addition.
#
# 0b. (Slice 2) Every "number" field below (pct, rate, capNights, and the two
#    range fields) now sets `value_type: "float"` (or "int" for capNights).
#    Decap's number widget docs say its data type is "string by default;
#    configured by value_type option." Confirmed hands-on against a real
#    local Decap instance (see the handback): without value_type, a save
#    from the CMS writes "7.5" instead of 7.5, which fails
#    tax-regions.schema.json's numeric typing. With it, a no-op save of
#    Austria and of Croatia (which has rate, range.min and range.max) came
#    back byte-identical, and a brand-new test entry wrote rate as a real
#    JSON number.
#
# 0c. (Slice 2) A "Range (optional)" object field was added under each region,
#    since croatia.json and czechia.json both carry a `range: {min, max}` on
#    some regions and the brief's given fields list had no widget for it.
#    Confirmed hands-on that a no-op save of Croatia's range-bearing regions
#    comes back byte-identical with this field in place; we did not
#    separately confirm what removing it would do, but Decap's list widget
#    is config-driven (it serializes the fields it knows about), so a key
#    with no matching field definition is not expected to round-trip.
#    Its own "min"/"max" sub-fields need required: false too, or Decap's
#    own validation blocks saving any region that has no range at all,
#    which is most of them. Confirmed hands-on: left required (the default),
#    Decap refused to publish a new region with no range.
#
# 0d. (Slice 2, OPEN ISSUE, not fixed here) A region saved through the CMS
#    with its optional provenance fields left blank does not come back
#    schema-valid. Decap omits a key entirely when its field is blank,
#    rather than writing null, so a freshly-created legacy region's
#    provenance ends up as just {"status": "legacy"}. tax-regions.schema.json
#    requires checked_date, changed_date, source_url, source_name,
#    source_type and confidence to all be present (even as null) on every
#    region, so ajv rejects that entry: "must have required property
#    'checked_date'." Confirmed hands-on, including trying `default: null`
#    on each of those six fields; it made no difference, Decap still drops
#    them. This is a schema/Decap mismatch, not a config problem, and we did
#    not change tax-regions.schema.json to work around it, since Step 4 of
#    the brief gives that file's exact text. The likely fix is narrowing
#    provenance's required list to just ["status"], and having any code
#    that reads these fields (check-date-honesty.mjs included) treat a
#    missing key the same as a null one. Flagging rather than shipping
#    something that looks right in the config but fails the moment someone
#    actually uses it to add a new, not-yet-sourced fact, which is exactly
#    the Austria "alpine" / Tyrol situation this slice is built around.
#
# 1. editorial_workflow does NOT work under local_backend / decap-server.
#    Decap's own docs, "Decap Proxy: Work With a Local Repository", state
#    this as a named limitation. So with local_backend: true, saves in the
#    CMS will write straight to the local file, there is no draft/PR step to
#    click through yet, even though publish_mode: editorial_workflow is set
#    below. That line is left in because it is what production (Step 5)
#    needs, and because leaving it in does not break local testing, it is
#    just inert locally. Concretely: Step 4's "prove the editing experience
#    and its editorial workflow" claim is only half provable locally, you
#    can prove the form and the fields render and save correctly, you
#    cannot prove the draft-PR-publish loop until Step 5's real GitHub OAuth
#    is wired. Flagging this rather than quietly building past it.
#
# 2. backend.name stays "github" (not "git-gateway") even during local
#    testing. Decap's own local-repository doc happens to pair local_backend
#    with git-gateway in its example, because that combination is common for
#    sites that already use Netlify Identity. We are not on Netlify and have
#    no Git Gateway service, our real backend is GitHub via a Cloudflare
#    Worker OAuth proxy (Step 5). local_backend interception is keyed off
#    running on localhost, not off backend.name, so backend: github plus
#    local_backend: true is a documented-in-the-wild combination and is the
#    right one for us: the same config.yml serves both local and production
#    testing, exactly as Decap's docs describe as the intended pattern.

backend:
  name: github
  repo: Varsanyi14/truetripcosts
  branch: main
  # The address of the ttc-cms-auth Worker (the sign-in helper). No trailing slash.
  base_url: https://ttc-cms-auth.varsanyi.workers.dev
  auth_endpoint: auth

local_backend: true

publish_mode: editorial_workflow

media_folder: "public/uploads"

collections:
  - name: "tax_regions"
    label: "Tourist tax, by country"
    folder: "src/data/facts/tax-regions"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "country"
    fields:
      - { label: "Country", name: "country", widget: "string" }
      - { label: "Default unit", name: "unit", widget: "select", options: ["percentOfRoom", "perPersonPerNight"], required: false }
      - { label: "Currency", name: "currency", widget: "string", required: false }
      - { label: "Cap nights (optional)", name: "capNights", widget: "number", value_type: "int", required: false }
      - label: "Regions"
        name: "regions"
        widget: "list"
        summary: "{{label}}"
        fields:
          - { label: "Key (slug, must match what the site code expects)", name: "key", widget: "string" }
          - { label: "Display label", name: "label", widget: "string" }
          - { label: "Unit (optional, overrides the country default above)", name: "unit", widget: "select", options: ["percentOfRoom", "perPersonPerNight"], required: false }
          - { label: "Percent (percentOfRoom only)", name: "pct", widget: "number", value_type: "float", required: false }
          - { label: "Flat rate (perPersonPerNight only)", name: "rate", widget: "number", value_type: "float", required: false }
          - label: "Range (optional, shown only when the rate varies by place)"
            name: "range"
            widget: "object"
            required: false
            fields:
              - { label: "Min", name: "min", widget: "number", value_type: "float", required: false }
              - { label: "Max", name: "max", widget: "number", value_type: "float", required: false }
          - { label: "Note shown to readers", name: "note", widget: "text" }
          - label: "Provenance"
            name: "provenance"
            widget: "object"
            fields:
              - { label: "Status", name: "status", widget: "select", options: ["legacy", "verified"] }
              - { label: "Checked date", name: "checked_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "Changed date", name: "changed_date", widget: "string", required: false, hint: "YYYY-MM-DD or YYYY-MM" }
              - { label: "Source URL", name: "source_url", widget: "string", required: false }
              - { label: "Source name", name: "source_name", widget: "string", required: false }
              - { label: "Source type", name: "source_type", widget: "select", options: ["official-government", "operator-official", "reputable-secondary"], required: false }
              - { label: "Confidence", name: "confidence", widget: "select", options: ["high", "medium", "low"], required: false }
